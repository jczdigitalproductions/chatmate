[project]
name = "chatmatefetcher"
version = "0.1.0"
description = "ChatMateFetcher: a Fetch.ai agent built with fetch-hackkit"
requires-python = ">=3.11"
dependencies = [
    "fetch-hackkit[mcp]>=0.2.0",
    "uagents>=0.26.1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.format]
exclude = ["*.md"]  # keep doc snippets compact
